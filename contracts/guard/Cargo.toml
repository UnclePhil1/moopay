[package]
name = "moopay-guard"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "A spending guard for a MooPay agent wallet: limits, allowlists and a time-lock that hold even if the agent's server is breached."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.15.1"

[dev-dependencies]
near-sdk = { version = "=5.15.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
