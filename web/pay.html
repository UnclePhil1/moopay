<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Pay with MooPay</title>
<link rel="icon" href="/p/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/p/assets/modal-ui.css">
<style>
  :root { --bg:#0a0a0a; --card:#141414; --line:rgba(244,239,230,.1); --text:#f4efe6; --muted:#aaa49a; --accent:#f4efe6; --accent-2:#d9d3c7; --ok:#f4efe6; --bad:#ff8a8a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:16px/1.55 "Inter",system-ui,sans-serif; display:grid; place-items:start center; padding:32px 16px;
     }
  main { width:min(460px,100%); }
  .logo { display:block; height:28px; margin:0 auto 28px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:26px; box-shadow:0 30px 80px rgba(0,0,0,.5); }
  h1 { font:800 34px/1.1 "Inter",sans-serif; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 22px; font-size:15px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); font-size:15px; }
  .row span:first-child { color:var(--muted); }
  .row b { font-weight:600; text-align:right; word-break:break-all; }
  .card { overflow:hidden; }
  .msg { overflow-wrap:anywhere; }
  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:18px 0 6px; }
  input { width:100%; padding:14px; border-radius:14px; border:1px solid var(--line); background:#0a0a0a; color:var(--text); font:600 16px "Inter",sans-serif; }
  .btn { width:100%; margin-top:22px; padding:16px; border:1.5px solid transparent; border-radius:999px; background:var(--accent); color:#0a0a0a; font:700 17px "Inter",sans-serif; cursor:pointer; transition:background .2s, color .2s, border-color .2s, transform .15s, box-shadow .2s; }
  .btn:hover:not(:disabled) { background:var(--accent-2); transform:translateY(-1px); box-shadow:0 8px 24px rgba(244,239,230,.12); }
  .btn:active:not(:disabled) { transform:scale(.98); box-shadow:none; }
  .btn:disabled { opacity:.55; cursor:default; }
  .btn.ghost { background:transparent; color:var(--text); border:1.5px solid var(--text); box-shadow:none; margin-top:10px; padding:12px; font-size:14px; }
  .btn.ghost:hover:not(:disabled) { background:rgba(244,239,230,.12); box-shadow:none; }
  .btn.ghost:active:not(:disabled) { background:rgba(244,239,230,.2); }
  /* the custom picker for "Pay from" and "Pay with" */
  .dd { position:relative; }
  .dd-btn { width:100%; display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:#0a0a0a; color:var(--text); font:600 16px "Inter",sans-serif; cursor:pointer; text-align:left; transition:border-color .2s, background .2s; }
  .dd-btn:hover, .dd.open .dd-btn { border-color:rgba(244,239,230,.35); background:#101010; }
  .dd-btn .lab { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dd-btn .chev { width:16px; height:16px; stroke:var(--muted); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s; flex:none; }
  .dd.open .chev { transform:rotate(180deg); }
  .dd-badge { width:30px; height:30px; flex:none; border-radius:50%; display:grid; place-items:center; background:rgba(244,239,230,.1); border:1px solid var(--line); color:var(--text); font:700 11px "Inter",sans-serif; text-transform:uppercase; }
  .dd-list { max-height:0; overflow:hidden; opacity:0; transition:max-height .25s ease, opacity .2s ease, margin .2s ease; border-radius:14px; background:#0a0a0a; border:1px solid transparent; }
  .dd.open .dd-list { max-height:240px; overflow-y:auto; opacity:1; margin-top:8px; border-color:var(--line); }
  .dd-opt { display:flex; align-items:center; gap:12px; width:100%; padding:10px 14px; border:0; background:none; color:var(--text); font:600 15px "Inter",sans-serif; text-align:left; cursor:pointer; transition:background .15s; }
  .dd-opt:hover, .dd-opt.cur { background:rgba(244,239,230,.08); }
  .dd-opt .tick { margin-left:auto; width:16px; height:16px; stroke:var(--text); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; opacity:0; }
  .dd-opt[aria-selected=true] .tick { opacity:1; }
  .msg { margin-top:16px; font-size:14px; color:var(--muted); min-height:20px; }
  .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
  .addr { display:flex; gap:8px; margin-top:8px; }
  .addr code { flex:1; min-width:0; overflow-x:auto; white-space:nowrap; padding:11px 12px; border-radius:12px; background:#0a0a0a; border:1px solid var(--line); font-size:12.5px; }
  .addr button { padding:0 14px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--text); font:600 13px "Inter",sans-serif; cursor:pointer; }
  .okline { font-size:18px; font-weight:600; margin:4px 0 0; }
  .linkbtn { display:block; text-align:center; text-decoration:none; color:#000; box-sizing:border-box; }
  .hidden { display:none !important; }
  /* Wallet choices sit above everything on the page, wallet pop-ups included. */
  .overlay { position:fixed; inset:0; z-index:2147483000; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.72); }
  .overlay .panel { width:min(420px,100%); max-height:100%; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .overlay .panel .msg { margin:0 0 12px; color:var(--text); font-weight:600; }
  .overlay .panel .btn { margin-top:8px; }
  :root { --w3m-z-index:2147483600; --apkt-z-index:2147483600; }
  .nws-modal-wrapper { z-index:2147483600 !important; }
  .embed body { padding:14px 12px; min-height:0; background:transparent; } .embed .logo { display:none; } .embed .foot { display:none; } .embed .card { box-shadow:none; }
  .foot { text-align:center; color:var(--muted); font-size:12.5px; margin-top:18px; }
  a:not(.btn) { color:var(--accent-2); }
</style>
</head>
<body>
<script>if (window.parent !== window) document.documentElement.classList.add("embed");</script>
<main>
  <img class="logo" src="/p/assets/moopay-logo.png" alt="MooPay">
  <div class="card" id="card">
    <h1 id="title">Loading…</h1>
    <p class="sub" id="sub"></p>

    <div id="summary"></div>
    <p class="msg hidden" id="notice" style="color:var(--text);font-weight:600"></p>

    <div id="callform" class="hidden">
      <button class="btn" id="callgo" type="button">Sign</button>
      <button class="btn ghost" id="callcancel" type="button">Cancel</button>
      <div class="msg" id="callmsg"></div>
    </div>

    <div id="form" class="hidden">
      <div id="payoutbox" class="hidden">
        <label for="payout">NEAR wallet that receives your rNEAR</label>
        <input id="payout" placeholder="alice.near" autocomplete="off" spellcheck="false">
      </div>
      <label for="chain">Pay from</label>
      <select id="chain"></select>
      <label for="asset">Pay with</label>
      <select id="asset"></select>
      <div class="row" style="margin-top:18px"><span>You pay (fees included)</span><b id="pay">…</b></div>
      <div class="row"><span id="estlabel">They get exactly</span><b id="est">…</b></div>
      <button class="btn" id="send" type="button">Make transfer</button>
      <button class="btn ghost" id="manual" type="button">Pay by deposit address instead</button>
      <div id="refundbox" class="hidden">
        <label for="refund">Your address on that chain (for refunds if anything fails)</label>
        <input id="refund" autocomplete="off" spellcheck="false">
        <button class="btn" id="getaddr" type="button">Get deposit address</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <div id="deposit" class="hidden">
      <label id="dlabel">Deposit address (you don't need to copy this)</label>
      <div class="row hidden" id="exactrow"><span id="exactlabel">Send exactly</span><b id="exact"></b></div>
      <div class="addr"><code id="addr"></code><button id="copy" type="button">Copy</button></div>
      <div class="msg" id="dmsg"></div>
    </div>
    <div id="done" class="hidden">
      <p class="okline" id="doneline">Your money has arrived.</p>
      <a id="tx" class="btn linkbtn" target="_blank" rel="noopener noreferrer"></a>
      <p class="msg" id="donenote">Go back to your chat and say "done". Your AI can confirm it with MooPay.</p>
    </div>
    <div class="msg" id="top-msg"></div>
  </div>
  <p class="foot">MooPay never holds your money. You sign from your own wallet.</p>
</main>
<div id="pickbox" class="overlay hidden">
  <div class="panel">
    <p class="msg" id="picktitle"></p>
    <div id="picklist"></div>
  </div>
</div>
<div id="usebox" class="overlay hidden">
  <div class="panel">
    <p class="msg" id="usetext"></p>
    <button class="btn" id="useyes" type="button">Yes, use it</button>
    <button class="btn ghost" id="useno" type="button">Use another wallet</button>
  </div>
</div>
<script src="/p/assets/pay.js"></script>
</body>
</html>
