<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Xmind:wght@400;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1500px;height:500px;background:#0a0a0a;background-image:radial-gradient(#262626 2px,transparent 2px);background-size:40px 40px;color:#f4efe6;font-family:"Xmind",sans-serif;position:relative;overflow:hidden}
.logo{position:absolute;top:84px;right:337px;height:32px}
.wrap{position:absolute;left:340px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:0}
.tag{align-self:flex-start;background:#f4efe6;color:#0a0a0a;padding:5px 16px;font-size:20px;font-weight:400;letter-spacing:.02em;text-transform:uppercase}
.box{width:820px;height:96px;border:2px solid #f4efe6;background:#0a0a0a;display:flex;align-items:center;justify-content:space-between;padding:0 19px 0 36px;margin-top:12px;border-radius:48px}
.box span{font-size:46px;font-weight:400;letter-spacing:-.01em}
.send{width:58px;height:58px;border-radius:50%;background:#f4efe6;display:flex;align-items:center;justify-content:center}
.caret{display:inline-block;width:3px;height:44px;background:#f4efe6;vertical-align:-7px;margin-left:6px}
</style>
<img class="logo" src="moopay-wordmark.png">
<div class="wrap"><div class="tag">AI money agent</div>
<div class="box"><span>Send 2 NEAR to moopay.near<i class="caret"></i></span>
<div class="send"><svg width="27" height="32" viewBox="0 0 20 24" fill="none" stroke="#0a0a0a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 22V3M3 10l7-7 7 7"/></svg></div></div></div>
