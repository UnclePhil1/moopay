<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Xmind:wght@400;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1500px;height:500px;background:#f4efe6;color:#0a0a0a;font-family:"Xmind",sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.top{display:flex;align-items:center;gap:22px}
.top img{height:54px;filter:invert(1)}
.tag{background:#0a0a0a;color:#f4efe6;padding:8px 20px;font-size:34px;letter-spacing:.03em;text-transform:uppercase}
.box{width:1060px;height:128px;border:2px solid #0a0a0a;border-radius:70px;background:#fff9ee;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 52px;box-shadow:10px 10px 0 #0a0a0a}
.box span{font-size:62px;font-weight:400}
.send{width:84px;height:84px;border-radius:50%;background:#0a0a0a;display:flex;align-items:center;justify-content:center}
.caret{display:inline-block;width:4px;height:58px;background:#0a0a0a;vertical-align:-8px;margin-left:6px}
</style>
<div class="top"><img src="moopay-mark.png"><div class="tag">AI money agent</div></div>
<div class="box"><span>Send 2 NEAR to moopay.near<i class="caret"></i></span>
<div class="send"><svg width="40" height="48" viewBox="0 0 20 24" fill="none" stroke="#f4efe6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 22V3M3 10l7-7 7 7"/></svg></div></div>
