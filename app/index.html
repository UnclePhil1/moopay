<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>MooPay Agent</title>
<link rel="icon" href="/app/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0a; --panel:#111; --card:#161616; --line:rgba(244,239,230,.10); --line2:rgba(244,239,230,.18); --text:#f4efe6; --muted:#aaa49a; --dim:#6f6b63; --ok:#7ee0a8; --warn:#f2c36b; --bad:#ff8a8a; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 "Inter",system-ui,sans-serif; overflow:hidden; }
  button,input { font:inherit; color:inherit; } button { cursor:pointer; }
  .app { display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line); }
  header img { height:22px; }
  .spacer { flex:1; }
  .how { color:var(--muted); font-size:13.5px; text-decoration:none; } .how:hover { color:#f4efe6; }
  .pill[hidden] { display:none; }
  .pill { display:inline-flex; align-items:center; gap:8px; padding:5px 12px; border:1px solid var(--line); border-radius:999px; font-size:12.5px; color:var(--muted); }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); } .dot.work { background:var(--warn); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  #scroll { flex:1; min-height:0; overflow-y:auto; }
  .wrap { width:min(720px,100%); margin:0 auto; padding:22px 20px 16px; }
  .empty { text-align:center; padding:12vh 0 20px; }
  .empty img { height:50px; margin-bottom:18px; }
  .empty h2 { font-size:30px; line-height:1.15; margin:0 0 8px; font-weight:800; letter-spacing:-.02em; }
  .empty p { color:var(--muted); margin:0 auto 22px; max-width:420px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .chip { background:none; border:1px solid var(--line); border-radius:999px; padding:9px 15px; color:var(--muted); font-size:14px; }
  .chip:hover { border-color:var(--line2); color:var(--text); }
  .msg { display:flex; gap:12px; margin:18px 0; animation:in .25s ease; }
  @keyframes in { from { opacity:0; transform:translateY(6px); } }
  .msg.me { justify-content:flex-end; align-items:center; gap:6px; }
  .msg .del { background:none; border:0; color:var(--mute,#888); font-size:18px; line-height:1; padding:4px 6px; opacity:0; cursor:pointer; } .msg.me:hover .del, .msg .del:focus { opacity:.8; } @media (hover:none) { .msg .del { opacity:.45; } }
  #send.stop svg { stroke:none; fill:#000; }
  .msg.me .bubble { background:#f4efe6; color:#000; border-radius:18px 18px 4px 18px; padding:10px 15px; max-width:82%; font-weight:500; word-break:break-word; }
  .av { width:30px; height:30px; flex:none; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; background:var(--panel); }
  .av img { width:19px; }
  .body { min-width:0; flex:1; } .body > * + * { margin-top:10px; }
  .txt { white-space:pre-wrap; word-break:break-word; }
  .steps { border:1px solid var(--line); border-radius:16px; padding:6px 14px; background:var(--panel); }
  .step { display:flex; align-items:center; gap:10px; padding:7px 0; color:var(--muted); font-size:14px; } .step.done { color:var(--text); }
  .step .i { width:16px; height:16px; flex:none; display:grid; place-items:center; }
  .dots { display:flex; gap:5px; align-items:center; height:22px; } .dots i { width:7px; height:7px; border-radius:50%; background:var(--muted); animation:wave 1.2s ease-in-out infinite; } .dots i:nth-child(2) { animation-delay:.15s; } .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes wave { 0%,60%,100% { transform:translateY(0); opacity:.35; } 30% { transform:translateY(-6px); opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation:none; opacity:.6; } }
  .spin { width:13px; height:13px; border:2px solid var(--line2); border-top-color:#f4efe6; border-radius:50%; animation:sp .7s linear infinite; } @keyframes sp { to { transform:rotate(360deg); } }
  .tick { color:var(--ok); font-weight:700; }
  .card { border:1px solid var(--line); background:var(--card); border-radius:20px; padding:18px; }
  .card h3 { margin:0 0 2px; font-size:17px; font-weight:700; } .sub { color:var(--muted); font-size:13.5px; }
  .row { display:flex; justify-content:space-between; gap:14px; padding:10px 0; border-top:1px solid var(--line); font-size:14.5px; }
  .row span:first-child { color:var(--muted); } .row b { font-weight:600; text-align:right; word-break:break-all; }
  .big { font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1.1; margin:2px 0 8px; }
  .modal { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.62); animation:fade .15s ease; }
  .modal .box { width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line2); border-radius:18px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.5); animation:in .18s ease; }
  .modal h3 { margin:0 0 8px; font-size:18px; font-weight:700; } .modal p { margin:0; color:var(--muted); font-size:14.5px; line-height:1.5; }
  .modal input { width:100%; margin-top:14px; background:var(--card); border:1px solid var(--line2); border-radius:12px; padding:12px 14px; color:var(--text); font-size:14.5px; outline:none; } .modal input:focus { border-color:#f4efe6; }
  .modal .code code { white-space:normal; word-break:break-all; }
  .modal .err { color:var(--bad); font-size:13px; margin-top:8px; min-height:0; }
  .modal .btns { justify-content:flex-end; margin-top:18px; } .btn.danger { background:var(--bad); }
  @keyframes fade { from { opacity:0; } }
  .sheet { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; padding:12px; }
  .sheet .box { position:relative; width:min(480px,100%); height:min(760px,100%); background:#141414; border:1px solid var(--line2); border-radius:22px; overflow:hidden; }
  @keyframes rise { from { transform:translateY(24px); opacity:0; } }
  .sheet .box { animation:rise .22s ease; }
  @media (max-width:640px) { .sheet { align-items:flex-end; padding:0; } .sheet .box { width:100%; height:92dvh; border-radius:22px 22px 0 0; } }
  .sheet iframe { width:100%; height:100%; border:0; background:transparent; }
  .sheet .x { position:absolute; top:8px; right:10px; z-index:2; border:0; background:rgba(244,239,230,.1); color:#f4efe6; width:30px; height:30px; border-radius:50%; font-size:18px; cursor:pointer; }
  .btns { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .btn { border:0; border-radius:999px; background:#f4efe6; color:#000; padding:11px 22px; font-weight:700; }
  .btn.ghost { background:none; color:var(--text); border:1px solid var(--line2); } .btn:disabled { opacity:.45; cursor:default; }
  .tag { display:inline-block; font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid var(--line2); color:var(--muted); }
  .tag.ok { color:var(--ok); border-color:rgba(126,224,168,.4); } .tag.bad { color:var(--bad); border-color:rgba(255,138,138,.4); }
  .track { display:flex; align-items:center; margin:14px 0 4px; }
  .tn { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12.5px; color:var(--dim); min-width:70px; }
  .tn i { width:12px; height:12px; border-radius:50%; border:2px solid var(--line2); background:var(--bg); }
  .tn.on { color:var(--text); } .tn.on i { background:#f4efe6; border-color:#f4efe6; } .tn.cur i { animation:pulse 1s infinite; }
  .tl { flex:1; height:2px; background:var(--line2); margin-bottom:20px; } .tl.on { background:#f4efe6; }
  .code { display:flex; gap:8px; margin-top:8px; }
  .code code { flex:1; min-width:0; overflow-x:auto; white-space:nowrap; padding:11px 12px; border-radius:12px; background:#0a0a0a; border:1px solid var(--line); font-size:12.5px; }
  .code button { padding:0 14px; border-radius:12px; border:1px solid var(--line); background:none; font-size:13px; font-weight:600; }
  a { color:#f4efe6; }
  .list { border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--card); }
  .li { padding:12px 16px; border-top:1px solid var(--line); } .li:first-child { border-top:0; }
  .li b { font-weight:600; } .li span { color:var(--muted); font-size:13.5px; display:block; }
  .composer { padding:10px 20px 18px; position:relative; }
  .cbox { width:min(720px,100%); margin:0 auto; display:flex; gap:10px; align-items:center; border:1px solid var(--line2); border-radius:999px; background:var(--panel); padding:6px 6px 6px 20px; }
  .cbox:focus-within { border-color:#f4efe6; }
  #input { flex:1; min-width:0; background:none; border:0; outline:0; padding:10px 0; } #input::placeholder { color:var(--dim); }
  #send { width:42px; height:42px; border-radius:50%; border:0; background:#f4efe6; display:grid; place-items:center; flex:none; } #send:disabled { opacity:.35; cursor:default; }
  #send svg { width:18px; height:18px; stroke:#000; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .note { text-align:center; font-size:12px; color:var(--dim); margin-top:8px; }
  #palette { width:min(720px,100%); margin:0 auto 10px; max-height:min(280px,38vh); overflow-y:auto; overscroll-behavior:contain; background:var(--card); border:1px solid var(--line2); border-radius:18px; padding:6px; animation:fade .15s; }
  #palette[hidden] { display:none; }
  .cmd { display:flex; gap:14px; align-items:baseline; padding:10px 14px; border-radius:12px; width:100%; background:none; border:0; text-align:left; }
  .cmd.sel,.cmd:hover { background:rgba(244,239,230,.08); } .cmd b { min-width:84px; font-weight:700; } .cmd span { color:var(--muted); font-size:13.5px; }
  .toast { position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:#f4efe6; color:#000; padding:10px 18px; border-radius:999px; font-weight:600; font-size:14px; z-index:30; }
  @media (max-width:640px) { header { padding:12px 14px; } .wrap { padding:16px 14px; } .composer { padding:8px 12px 12px; } .note { display:none; } }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="/app/assets/moopay-logo.png" alt="MooPay">
    <span class="spacer"></span>
    <a class="how" href="/guide" target="_blank" rel="noopener">How it works</a>
    <span class="pill" id="nohist" hidden title="Your chat is not saved. Type /history to change that">Chat not saved</span>
    <span class="pill" id="frozen" hidden title="Nothing can leave this account. Type /unfreeze to lift it">Frozen</span>
    <span class="pill" id="temp" hidden title="Ends after an hour of not using it, or when you sign out">Temporary session</span>
    <span class="pill"><span class="dot" id="dot"></span><span id="state">Ready</span></span>
  </header>
  <div id="scroll"><div class="wrap" id="chat"></div></div>
  <div class="composer">
    <div id="palette" hidden></div>
    <form class="cbox" id="form" autocomplete="off">
      <input id="input" placeholder="Tell MooPay what to do, or type / for shortcuts" aria-label="Message">
      <button id="send" type="submit" aria-label="Send" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg></button>
    </form>
    <div class="note">MooPay keeps only a small working float. Everything above it goes to your own wallet.</div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const usd = (n) => "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const short = (a) => (String(a).length > 20 ? String(a).slice(0, 9) + "…" + String(a).slice(-6) : String(a));
/* One popup for every confirmation. ask({ title, text, confirm, cancel, danger, input: { placeholder, check(v) -> error text or "" } })
   resolves to true (confirmed), the typed text (when there is an input), or null (cancelled: Cancel, Esc or a click outside). */
function ask({ title, text, confirm = "Confirm", cancel = "Cancel", danger = false, input: field, reveal } = {}) {
  return new Promise((resolve) => {
    const prev = document.activeElement;
    const err = h("div", { class: "err", role: "alert" });
    const inp = field ? h("input", { type: field.type || "text", placeholder: field.placeholder || "", autocomplete: "off", spellcheck: "false" }) : null;
    const ok = h("button", { class: "btn" + (danger ? " danger" : "") }, confirm), no = h("button", { class: "btn ghost" }, cancel);
    // reveal: show a value (like a key) inside the popup only, with a Copy button; there is just one button, Done
    const shown = reveal ? h("div", { class: "code", style: "margin-top:14px" }, h("code", {}, reveal), h("button", { onclick: (e) => copy(reveal, e.target) }, "Copy")) : null;
    const box = h("div", { class: "box", role: "dialog", "aria-modal": "true", "aria-label": title || "Confirm" }, h("h3", {}, title || "Are you sure?"), text ? h("p", {}, text) : null, inp, shown, inp ? err : null, h("div", { class: "btns" }, reveal ? null : no, ok));
    const wrap = h("div", { class: "modal" }, box);
    const close = (v) => { wrap.remove(); document.removeEventListener("keydown", key, true); if (prev && prev.focus) prev.focus(); resolve(v); };
    const submit = () => {
      if (!inp) return close(true);
      const v = inp.value.trim(), bad = field.check ? field.check(v) : v ? "" : "Enter a value.";
      if (bad) { err.textContent = bad; inp.focus(); return; }
      close(v);
    };
    const key = (e) => {
      if (e.key === "Escape") { e.preventDefault(); close(null); }
      else if (e.key === "Enter" && e.target !== no) { e.preventDefault(); submit(); }
      else if (e.key === "Tab") { const f = [...box.querySelectorAll("input,button")]; const i = f.indexOf(document.activeElement); e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); }
    };
    ok.addEventListener("click", submit); no.addEventListener("click", () => close(null));
    wrap.addEventListener("mousedown", (e) => { if (e.target === wrap) close(null); });
    document.addEventListener("keydown", key, true);
    document.body.append(wrap); (inp || ok).focus();
  });
}
function copy(t, btn) { try { navigator.clipboard.writeText(t); } catch {} const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = o), 1400); }

/* This browser's identity: the recovery code (kept for good) or, on someone else's device, a temporary session token (kept until the tab closes). */
const ID_KEY = "moopay.device", SAVED_KEY = "moopay.saved";
const rand = () => btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
const isTemp = () => { try { return !!sessionStorage.getItem(ID_KEY); } catch { return false; } };
/* Optional passphrase lock: the recovery code is kept encrypted in this browser (PBKDF2 + AES-GCM) and only decrypted in memory after unlocking. */
const VAULT_KEY = "moopay.vault", enc = new TextEncoder(), dec = new TextDecoder();
let held = null, vaultKey = null, vaultSalt = null; // the decrypted code, and what is needed to re-encrypt it
const b64 = (u) => btoa(String.fromCharCode(...u)), unb64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
const vaultOn = () => { try { return !!localStorage.getItem(VAULT_KEY); } catch { return false; } };
async function derive(pass, salt) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(code) {
  const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, vaultKey, enc.encode(code)));
  localStorage.setItem(VAULT_KEY, JSON.stringify({ s: b64(vaultSalt), i: b64(iv), c: b64(ct) })); held = code;
}
async function unlockWith(pass) { // throws when the passphrase is wrong
  const v = JSON.parse(localStorage.getItem(VAULT_KEY)), salt = unb64(v.s), key = await derive(pass, salt);
  held = dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(v.i) }, key, unb64(v.c))); vaultKey = key; vaultSalt = salt;
}
/** Keeps a (new) recovery code in this browser: in the lock if there is one, otherwise as before. */
async function keepCode(code) { if (vaultKey) await seal(code); else localStorage.setItem(ID_KEY, code); }

function deviceToken() {
  try {
    const t = sessionStorage.getItem(ID_KEY) || held || localStorage.getItem(ID_KEY);
    if (t) return t;
    if (vaultOn()) throw new Error("MooPay is locked. Reload the page and enter your passphrase.");
    const n = rand(); localStorage.setItem(ID_KEY, n); return n;
  } catch (e) { if (/locked/.test(e.message)) throw e; return (window.__t ||= rand().replace(/[-_]/g, "x")); }
}
async function unlockOnBoot() {
  if (!vaultOn() || isTemp() || held) return true;
  let note = "Enter the passphrase you chose for this browser.";
  for (;;) {
    const pass = await ask({ title: "Unlock MooPay", text: note, confirm: "Unlock", cancel: "Not now", input: { placeholder: "Passphrase", type: "password", check: (v) => (v ? "" : "Enter your passphrase.") } });
    if (!pass) return false;
    try { await unlockWith(pass); return true; } catch { note = "That passphrase didn't work. Try again."; }
  }
}
/* a temporary session only clears itself, so the device owner's own account on this browser is never touched */
const forgetDevice = () => { for (const s of isTemp() ? [sessionStorage] : [localStorage, sessionStorage]) try { s.removeItem(ID_KEY); s.removeItem(SAVED_KEY); s.removeItem(VAULT_KEY); } catch {} held = vaultKey = null; };
const leave = () => { forgetDevice(); location.replace("/?home"); };
async function api(path, opts = {}) {
  const res = await fetch("/agent/api/" + path, { ...opts, headers: { ...(opts.headers || {}), "x-moopay-device": deviceToken(), "content-type": "application/json" } });
  if (res.status === 401) { leave(); throw new Error("Session ended"); }
  if (!res.ok && !res.body) throw new Error("Request failed");
  return res;
}

const chat = $("chat"), scroller = $("scroll");
const down = () => (scroller.scrollTop = scroller.scrollHeight);
const work = (on, t) => { $("dot").classList.toggle("work", on); $("state").textContent = on ? t || "Working…" : "Ready"; };
const clearEmpty = () => $("empty")?.remove();
function userMsg(t, id) {
  clearEmpty(); const m = h("div", { class: "msg me" }, h("div", { class: "bubble" }, t)); if (id) m.dataset.turn = id;
  m.prepend(h("button", { class: "del", type: "button", title: "Delete this message", "aria-label": "Delete this message", onclick: () => removeTurn(m) }, "×"));
  chat.append(m); down(); return m;
}
async function removeTurn(m) {
  const id = m.dataset.turn; if (busy && !id) return;
  if (!(await ask({ title: "Delete this message?", text: "This removes it and my reply from the chat.", confirm: "Delete", danger: true }))) return;
  if (id) { await api("chat/delete", { method: "POST", body: JSON.stringify({ id }) }).catch(() => undefined); chat.querySelectorAll('[data-turn="' + id + '"]').forEach((x) => x.remove()); } else m.remove();
  if (!chat.children.length) start();
}
function agent(id) { clearEmpty(); const body = h("div", { class: "body" }); chat.append(h("div", { class: "msg", ...(id ? { "data-turn": id } : {}) }, h("div", { class: "av" }, h("img", { src: "/app/assets/moopay-mark.png", alt: "" })), body)); down(); return body; }
async function say(b, text) { const t = h("div", { class: "txt" }); b.append(t); for (let i = 0; i < text.length; i += 3) { t.textContent = text.slice(0, i + 3); down(); await sleep(8); } t.textContent = text; }
const row = (k, v) => h("div", { class: "row" }, h("span", {}, k), h("b", {}, v));
const CHAIN = { btc: "Bitcoin", sol: "Solana", eth: "Ethereum", near: "NEAR" };

/* cards */
/** Pay and sign without leaving the chat: the pay page opens as a sheet over it. */
const SHEET_KEY = "moopay:sheet";
const remember = (url) => { try { url ? sessionStorage.setItem(SHEET_KEY, url) : sessionStorage.removeItem(SHEET_KEY); } catch {} };
function openSheet(url) {
  document.querySelectorAll(".sheet").forEach((x) => x.remove());
  remember(url); // a reload brings the window back where it was
  const close = () => { box.remove(); window.removeEventListener("message", onMsg); remember(null); };
  const onMsg = (e) => { if (e.origin === location.origin && e.data && e.data.moopay === "delivered") { void poll(); setTimeout(() => void poll(), 2500); setTimeout(close, 2500); } };
  const box = h("div", { class: "sheet", onclick: (e) => { if (e.target === box) close(); } },
    h("div", { class: "box" }, h("button", { class: "x", onclick: close, "aria-label": "Close" }, "\u00d7"), h("iframe", { src: url + (url.includes("?") ? "&" : "?") + "embed=1", allow: "clipboard-write" })));
  window.addEventListener("message", onMsg);
  document.body.append(box);
}
function card(c) {
  switch (c.kind) {

  if (!(await ask({ title: "Erase your data?", text: "This removes your chat, activity, schedules and agent keys from MooPay and signs out every browser. Move your money out first: I won't erase an account that still holds money.", confirm: "Erase", danger: true }))) return;
  try { await post("delete"); leave(); } catch (e) { await fail(e, "I couldn't erase that."); }
}
/* once there is money in the account, ask them to keep the code */
function nudge(balance) { try { if (!isTemp() && Number(balance) > 0 && !localStorage.getItem(SAVED_KEY)) showRecovery(true); } catch {} }
function pick(c) { pal.hidden = true; if (c.act) { input.value = ""; sync(); return void c.act(); } if (c.privacy) { input.value = ""; sync(); clearEmpty(); agent().append(card({ kind: "privacy" })); down(); return; } if (c.recovery) { input.value = ""; sync(); return showRecovery(false); } if (c.restore) { input.value = ""; sync(); return restore(); } if (c.exportKey) { input.value = ""; sync(); return void exportKey(); } if (c.clear) { input.value = ""; sync(); void api("chat/delete", { method: "POST", body: JSON.stringify({ all: true }) }).catch(() => undefined); return start(); } if (c.ex) { input.value = c.ex; input.focus(); sync(); } else { input.value = ""; sync(); void submit(c.run); } }
const SEND = "M12 19V5m0 0-6 6m6-6 6 6", STOP = "M7 7h10v10H7z";
function sync() { const s = $("send"); s.classList.toggle("stop", busy); s.setAttribute("aria-label", busy ? "Stop" : "Send"); s.querySelector("path").setAttribute("d", busy ? STOP : SEND); s.disabled = busy ? false : !input.value.trim(); }
input.addEventListener("input", () => { sel = 0; paletteFor(input.value); sync(); });
input.addEventListener("keydown", (e) => {
  if (pal.hidden) return;
  if (e.key === "ArrowDown") { e.preventDefault(); sel = (sel + 1) % shown.length; paletteFor(input.value); }
  else if (e.key === "ArrowUp") { e.preventDefault(); sel = (sel - 1 + shown.length) % shown.length; paletteFor(input.value); }
  else if (e.key === "Tab" || (e.key === "Enter" && shown[sel] && input.value.toLowerCase() !== shown[sel].name)) { e.preventDefault(); pick(shown[sel]); }
  else if (e.key === "Escape") pal.hidden = true;
});
document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement !== input) { e.preventDefault(); input.focus(); input.value = "/"; paletteFor("/"); sync(); } });
$("form").addEventListener("submit", (e) => { e.preventDefault(); if (busy) void stop(); else void submit(); });

function start() {
  chat.replaceChildren(h("div", { id: "empty", class: "empty" }, h("img", { src: "/app/assets/moopay-mark.png", alt: "" }), h("h2", {}, "Where should the money go?"),
    h("p", {}, "Tell me in plain words. I find the route, send it, and follow it until it lands."),
    h("div", { class: "chips" }, [["Show my account", "Show my account"], ["Add money", "Add $20 from my Solana wallet. My address is "], ["Send money", "Send $20 to "], ["Private claim", "Create a private claim of $20 for "]].map(([l, c]) => h("button", { class: "chip", onclick: () => { if (c.endsWith(" ")) { input.value = c; input.focus(); sync(); } else void submit(c); } }, l)),
      h("a", { class: "chip", href: "/guide", target: "_blank", rel: "noopener", style: "text-decoration:none" }, "How it works"))));
}

async function boot() {
  start(); $("temp").hidden = !isTemp();
  if (!(await unlockOnBoot())) { await say(agent(), "MooPay is locked. Reload the page to enter your passphrase, or type /restore and paste your recovery code."); return; }
  try {
    const s = await (await api("state")).json();
    if (s.code) throw new Error(s.message);
    lastEvent = s.lastEventId || 0; aiInfo = s.ai; $("frozen").hidden = !s.frozen; saveChat = s.saveChat !== false; $("nohist").hidden = saveChat;
    if (!s.live) { $("dot").style.background = "var(--warn)"; $("state").textContent = "AI not connected"; }
    if (s.chat?.length) { clearEmpty(); for (const m of s.chat) { if (m.role === "user") userMsg(m.content, m.id); else { const b = agent(m.id); b.append(h("div", { class: "txt" }, m.content)); } } }
    else if (s.account?.setupSteps?.length) { const b = agent(); await say(b, "Your private account is ready. No sign-up and no wallet to connect. This is a real NEAR wallet that you can inspect, withdraw from, or export. To start, add money (from any chain):"); b.append(card({ kind: "account", ...s.account })); }
    for (const a of s.approvals || []) agent().append(card(a));
    nudge(s.account?.balanceUsd);
  } catch (e) { $("state").textContent = "Offline"; }
  try { const open = sessionStorage.getItem(SHEET_KEY); if (open && new URL(open, location.href).origin === location.origin) openSheet(open); } catch {}
  setInterval(() => { if (!busy) void poll(); }, 6000);
}
void boot();
