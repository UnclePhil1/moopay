<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moo Pay</title>
<meta name="description" content="Tell an agent where the money should go. No sign-up, no wallet to connect. Private by default.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/app/assets/favicon.png" type="image/png">
<script>try { if ((localStorage.getItem("moopay.device") || localStorage.getItem("moopay.vault")) && !location.search) location.replace("/agent"); } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Xmind:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0a; --fg:#fff; --mute:#a3a3a3; --line:#262626; --mono: "Xmind", sans-serif; --sans: "Xmind", sans-serif; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--fg); font-family:var(--mono); font-size:13px; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  .app { display:grid; grid-template-columns:1fr 1fr; height:100dvh; }

  .left { position:relative; display:flex; flex-direction:column; background-color:var(--bg); background-image:radial-gradient(#262626 1px, transparent 1px); background-size:24px 24px; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:24px 48px; }
  .logo { display:flex; align-items:center; gap:10px; font:800 16px var(--sans); letter-spacing:-.02em; }
  .logo svg { width:32px; height:18px; }
  .top nav { display:flex; gap:24px; color:var(--mute); }
  .top nav a:hover { color:var(--fg); }
  .hero { flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 48px; }
  .tag { align-self:flex-start; background:var(--fg); color:#000; padding:2px 6px; font-size:11px; text-transform:uppercase; }
  h1 { margin:20px 0 0; font:800 clamp(34px, 5.4vw, 76px)/1 var(--sans); letter-spacing:-.04em; text-transform:uppercase; display:flex; flex-direction:column; align-items:flex-start; }
  h1 span { border:1px solid var(--line); padding:4px 16px 6px; margin-top:-1px; background:var(--bg); }
  .cta { align-self:flex-start; margin-top:48px; background:var(--fg); color:#000; padding:12px 18px; text-transform:uppercase; border:1px solid var(--fg); transition:background .2s, color .2s; }
  .cta:hover, .cta:focus-visible { background:#000; color:var(--fg); outline:none; }
  .dots { display:flex; justify-content:space-between; padding:0 48px; height:88px; align-items:center; border-top:1px solid var(--line); background:var(--bg); }
  .dots button { width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:none; color:var(--mute); font:inherit; cursor:pointer; transition:background .2s, color .2s, border-color .2s; }
  .dots button:hover { border-color:var(--fg); color:var(--fg); }
  .dots button[aria-current="true"] { background:var(--fg); color:#000; border-color:var(--fg); }

  .right { position:relative; background:#fff; color:#000; }
  .slide { position:absolute; inset:0; padding:24px 48px 48px; display:flex; flex-direction:column; opacity:0; visibility:hidden; transform:translateY(8px); transition:opacity .45s ease, transform .45s ease, visibility 0s .45s; }
  .slide.on { opacity:1; visibility:visible; transform:none; transition:opacity .45s ease .15s, transform .45s ease .15s, visibility 0s; }
  .art { flex:1; display:grid; place-items:center; }
  .art svg { width:min(300px, 60%); height:auto; overflow:visible; }
  .art rect { fill:none; stroke:#000; stroke-width:1.2; }
  .art circle { fill:#000; }
  .slide h2 { margin:0 0 16px; font:800 clamp(30px, 4vw, 52px)/1 var(--sans); letter-spacing:-.04em; text-transform:uppercase; }
  .slide p { margin:0; max-width:40ch; font-size:16px; line-height:1.6; }

  .stage { container-type:inline-size; position:relative; overflow:hidden; background:#000; color:#fff; width:min(100%, 560px, calc((100dvh - 340px) * 16 / 9)); aspect-ratio:16/9; font-family:var(--sans); }
  .stage .ly { position:absolute; inset:0; opacity:0; }
  .stage .mono { font-family:var(--mono); }
  .stage .mute { color:#a3a3a3; }
  .stage .mask { display:block; overflow:hidden; }
  .stage .mask > * { display:block; will-change:transform; }
  .stage .field { position:absolute; left:8cqw; right:8cqw; top:23cqw; height:10cqw; border:1px solid #333; background:#0a0a0a; display:flex; align-items:center; padding:0 3cqw; font:3cqw var(--mono); }
  .stage .caret { display:inline-block; width:.12em; height:1.1em; background:#fff; margin-left:2px; vertical-align:-.15em; }
  .stage .btn { position:absolute; right:1.5cqw; top:1.5cqw; width:7cqw; height:7cqw; border-radius:50%; background:#fff; display:grid; place-items:center; }
  .stage .btn svg { width:3.2cqw; height:3.2cqw; stroke:#000; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .stage .cur { position:absolute; left:0; top:0; width:4cqw; height:4cqw; }
  .stage .bub { position:absolute; right:8cqw; top:6cqw; background:#fff; color:#000; padding:1.8cqw 3cqw; font:600 2.8cqw var(--sans); border-radius:3cqw 3cqw .6cqw 3cqw; }
  .stage .st { position:absolute; left:8cqw; display:flex; align-items:center; gap:2cqw; font:2.7cqw var(--sans); }
  .stage .st i { width:3.4cqw; height:3.4cqw; border-radius:50%; border:1px solid #fff; display:grid; place-items:center; font:700 2cqw var(--sans); font-style:normal; }
  .stage .card { position:absolute; left:8cqw; right:8cqw; top:31cqw; height:19cqw; border:1px solid #fff; padding:2.6cqw 3.4cqw; display:flex; justify-content:space-between; align-items:center; }
  .stage .card b { display:block; font:800 7cqw/1 var(--sans); letter-spacing:-.04em; margin:1.2cqw 0; }
  .stage .card small { font:2.2cqw var(--mono); color:#a3a3a3; text-transform:uppercase; letter-spacing:.06em; }
  .stage .line { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2cqw; font:800 9cqw/1.1 var(--sans); letter-spacing:-.045em; text-align:center; opacity:0; }
  .stage .logo4 { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.4cqw; }
  .hint { position:absolute; bottom:16px; right:48px; font-size:11px; color:#737373; }

  @media (max-width:860px) {
    .app { display:block; position:relative; }
    .left, .right { position:absolute; inset:0; transition:opacity .45s ease, visibility 0s; }
    .left { opacity:0; visibility:hidden; transition:opacity .45s ease .15s, visibility 0s .45s; }
    .app.show-left .left { opacity:1; visibility:visible; transition:opacity .45s ease .15s, visibility 0s; }
    .app.show-left .right { opacity:0; visibility:hidden; transition:opacity .45s ease, visibility 0s .45s; }
    .top, .hero { padding-inline:20px; } .top { padding-block:16px; } .top nav { gap:16px; }
    h1 { font-size:min(12vw, 64px); } h1 span { padding:4px 12px 6px; }
    .cta { margin-top:32px; } .dots { display:none; }
    .slide { padding:20px 20px 32px; } .art svg { width:min(220px, 60%); } .hint { right:20px; }
    .slide h2 { font-size:34px; } .slide p { font-size:15px; }
  }
  @media (prefers-reduced-motion: reduce) { .slide, .slide.on { transition:none; transform:none; } }
</style>
</head>
<body>
<main class="app" id="app">
  <section class="left">
    <div class="top">
      <a class="logo" href="/?home" aria-label="Moo Pay"><svg viewBox="0 0 36 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="#fff" stroke-width="4"/><circle cx="26" cy="10" r="8" fill="none" stroke="#fff" stroke-width="4"/></svg>Moo Pay</a>
      <nav><a href="/guide">Docs</a><a href="/agent">Connect</a></nav>
    </div>
    <div class="hero">
      <span class="tag">Private payments agent</span>
      <h1><span>Money that</span><span>moves in</span><span>private.</span></h1>
      <a class="cta" href="/agent">Open the agent &rarr;</a>
    </div>
    <div class="dots" id="dots" role="tablist" aria-label="Sections"></div>
  </section>

  <section class="right" id="right" aria-live="polite">
    <span class="hint">Scroll</span>
  </section>
</main>
<script>
  const SLIDES = [
    { anim: true, t: "How it works", p: "Tell the agent who gets what. It finds the route, sends it and follows it until it lands. No sign-up. No wallet to connect.", c: [[0,0],[1,0],[2,0],[1,1]], d: [[0,0],[1,1]] },
    { t: "Privacy", p: "Private claims open only for the one wallet you name. If nobody opens it within 24 hours, it is refunded.", c: [[0,0],[0,1],[1,1],[0,2],[1,2],[2,2]], d: [[0,0],[1,1],[2,2]] },
    { t: "Security", p: "Daily caps, new-recipient limits and approvals are enforced by the server. The AI cannot override them.", c: [[1,0],[0,1],[1,1],[2,1],[1,2]], d: [[1,1]] },
    { t: "Any chain", p: "Bitcoin, Solana, Ethereum, NEAR and more. Send one asset and the receiver gets another.", c: [[0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2]], d: [[0,0],[2,0],[0,2],[2,2]] },
    { t: "Stake on Rhea", p: "Stake NEAR on Rhea with any asset you hold. Tell the agent how much, and it does the rest.", c: [[0,2],[1,2],[1,1],[2,1],[2,0]], d: [[0,2],[1,1],[2,0]] },
    { t: "Always yours", p: "Only a small float stays in the account. The rest goes to your own wallet. Withdraw or export the key any time.", c: [[0,0],[0,1],[0,2],[1,2],[2,2]], d: [[0,0],[2,2]] },
  ];
  const ARROW = '<svg viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>';
  const FEATURES = ["Send to any chain", "Private claims", "Spending rules", "Agent keys", "Stake with Rhea", "No signups"];
  const STAGE = '<div class="stage" id="stage" role="img" aria-label="Typing a payment, the agent sending it, then what MooPay can do">'
    + '<div class="ly" id="lA"><div class="field"><span id="typed"></span><span class="caret" id="caret"></span><div class="btn" id="sendBtn">' + ARROW + '</div></div>'
    + '<svg class="cur" id="cur" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/></svg></div>'
    + '<div class="ly" id="lB"><div class="bub">send 1 NEAR to unclephil.near</div>'
    + '<div class="st" id="s1" style="top:19cqw"><i id="i1"></i><span>Finding the route</span></div>'
    + '<div class="st" id="s2" style="top:25cqw"><i id="i2"></i><span>Sending 1 NEAR</span></div>'
    + '<div class="card" id="card"><div><small>Sent</small><b>1 NEAR</b><span class="mute" style="font-size:2.6cqw">to unclephil.near</span></div><div class="mono" style="font-size:2.6cqw;text-align:right">Landed<br><span style="font-size:6cqw;line-height:1.3">&#10003;</span></div></div></div>'
    + '<div class="ly" id="lC">' + FEATURES.map((f, i) => '<div class="line"><span>' + f + '</span></div>').join("") + '</div>'
    + '<div class="ly" id="lD"><div class="logo4"><svg id="rings" viewBox="0 0 36 20" style="width:22cqw"><circle cx="10" cy="10" r="8" fill="none" stroke="#fff" stroke-width="4"/><circle cx="26" cy="10" r="8" fill="none" stroke="#fff" stroke-width="4"/></svg>'
    + '<span class="mask"><span id="word" style="font:800 11cqw/1.3 var(--sans);letter-spacing:-.04em">Moo Pay</span></span>'
    + '<span class="mask"><span id="tag" style="font-size:4cqw;color:#d4d4d4">Money that moves in private</span></span></div></div></div>';
  const art = (s) => { const u = 60; return '<svg viewBox="0 0 ' + 3 * u + " " + 3 * u + '" aria-hidden="true">' + s.c.map(([x, y]) => '<rect x="' + x * u + '" y="' + y * u + '" width="' + u + '" height="' + u + '"/>').join("") + s.d.map(([x, y]) => '<circle cx="' + x * u + '" cy="' + y * u + '" r="3"/>').join("") + "</svg>"; };
  const right = document.getElementById("right"), dots = document.getElementById("dots");
  SLIDES.forEach((s, i) => {
    right.insertAdjacentHTML("beforeend", '<article class="slide"><div class="art">' + (s.anim ? STAGE : art(s)) + "</div><h2>" + s.t + "</h2><p>" + s.p + "</p></article>");
    const b = document.createElement("button"); b.textContent = i + 1; b.setAttribute("aria-label", s.t); b.onclick = () => go(i); dots.append(b);
  });
  const slides = [...right.querySelectorAll(".slide")], btns = [...dots.children];
  /* On a phone the panels take turns: the black headline first, then the white slides. */
  const mq = matchMedia("(max-width:860px)"), app = document.getElementById("app");
  let cur = -1, lock = 0;
  function go(i) {
    i = Math.max(0, Math.min(mq.matches ? SLIDES.length : SLIDES.length - 1, i)); if (i === cur) return; cur = i;
    const k = mq.matches ? i - 1 : i;
    app.classList.toggle("show-left", mq.matches && i === 0);
    slides.forEach((e, n) => e.classList.toggle("on", n === k));
    btns.forEach((e, n) => e.setAttribute("aria-current", n === k));
  }
  mq.addEventListener("change", () => { cur = -1; go(0); });
  const step = (d) => { const n = Date.now(); if (n - lock < 700) return; lock = n; go(cur + d); };
  addEventListener("wheel", (e) => { if (Math.abs(e.deltaY) > 8) step(e.deltaY > 0 ? 1 : -1); }, { passive: true });
  addEventListener("keydown", (e) => { if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === "ArrowRight") step(1); else if (e.key === "ArrowUp" || e.key === "PageUp" || e.key === "ArrowLeft") step(-1); });
  let y0 = null;
  addEventListener("touchstart", (e) => { y0 = e.touches[0].clientY; }, { passive: true });
  addEventListener("touchend", (e) => { if (y0 == null) return; const d = y0 - e.changedTouches[0].clientY; y0 = null; if (Math.abs(d) > 40) step(d > 0 ? 1 : -1); }, { passive: true });
  go(0);

  /* The loop: every style is computed from the time t alone, so it can run, pause and restart anywhere. */
  const D = 18.4, MSG = "send 1 NEAR to unclephil.near";
  const q = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
  const ease = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const lerp = (a, b, x) => a + (b - a) * x;
  const win = (t, a, b, c, d) => ease(q(t, a, b)) * (1 - ease(q(t, c, d)));
  const $ = (id) => document.getElementById(id);
  const rise = (el, x) => { el.style.transform = "translateY(" + (1 - ease(x)) * 110 + "%)"; };
  const stage = $("stage");
  window.seek = (t) => {
    $("lA").style.opacity = win(t, 0, .4, 3.2, 3.6);
    $("typed").textContent = MSG.slice(0, Math.max(0, Math.floor((t - .6) * 16)));
    $("caret").style.opacity = t < 2.6 ? (Math.sin(t * 9) > -.3 ? 1 : 0) : 0;
    const m = ease(q(t, 2.3, 3));
    $("cur").style.transform = "translate(" + lerp(66, 85.5, m) + "cqw," + lerp(46, 29.5, m) + "cqw)";
    $("sendBtn").style.transform = "scale(" + (1 - .1 * Math.sin(Math.PI * q(t, 3, 3.25))) + ")";
    $("lB").style.opacity = win(t, 3.3, 3.7, 7.1, 7.5);
    const u = (el, a) => { el.style.opacity = ease(q(t, a, a + .4)); el.style.transform = "translateY(" + (1 - ease(q(t, a, a + .4))) * 1.5 + "cqw)"; };
    u($("s1"), 3.8); u($("s2"), 4.9); u($("card"), 5.9);
    $("i1").textContent = t > 4.7 ? "\u2713" : ""; $("i2").textContent = t > 5.7 ? "\u2713" : "";
    $("i1").style.borderTopColor = t > 4.7 ? "#fff" : "#444"; $("i2").style.borderTopColor = t > 5.7 ? "#fff" : "#444";
    $("i1").style.opacity = t > 4.7 ? 1 : .5 + .5 * Math.sin(t * 8); $("i2").style.opacity = t > 5.7 ? 1 : .5 + .5 * Math.sin(t * 8);
    $("lC").style.opacity = win(t, 7.5, 7.6, 15.4, 15.5);
    stage.querySelectorAll(".line").forEach((l, i) => { const a = 7.7 + i * 1.3; l.style.opacity = win(t, a, a + .35, a + .95, a + 1.3); });
    $("lD").style.opacity = win(t, 15.6, 15.8, 17.9, 18.4);
    $("rings").style.opacity = ease(q(t, 15.7, 16.3)); $("rings").style.transform = "scale(" + lerp(.85, 1, ease(q(t, 15.7, 16.5))) + ")";
    rise($("word"), q(t, 16.1, 16.7)); rise($("tag"), q(t, 16.5, 17.1));
  };
  const first = slides.findIndex((e) => e.querySelector("#stage"));
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) seek(6.4);
  else {
    let t0 = null;
    const frame = (now) => {
      if (slides[first].classList.contains("on") && !document.hidden) { if (t0 === null) t0 = now; seek(((now - t0) / 1000) % D); } else t0 = null;
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
</script>
</body>
</html>
