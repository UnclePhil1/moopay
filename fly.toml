# fly.toml app configuration file generated for moopay on 2026-11-01T20:51:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'moopay'
primary_region = 'ams'

[build]

[env]
  MOOPAY_HOST = '0.0.0.0'
  MOOPAY_HTTP_PORT = '8080'
  MOOPAY_TRUST_PROXY = '1'
  STATE_FILE = '/data/moopay-state.json'
  MOOPAY_PUBLIC_HOST = "moopay.fly.dev"

[[mounts]]
  source = 'moopay_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
