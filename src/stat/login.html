<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>MooPay stats</title>
<link rel="icon" href="/app/assets/favicon.png">
<style>
  :root { --bg:#0a0a0a; --card:#161616; --line:rgba(244,239,230,.10); --text:#f4efe6; --muted:#aaa49a; --ok:#7ee0a8; --bad:#ff8a8a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
  .modal { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:26px 24px 22px; box-shadow:0 24px 60px rgba(0,0,0,.55); }
  h1 { font-size:19px; margin:0 0 4px; } p { margin:0 0 18px; color:var(--muted); font-size:13.5px; }
  label { display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; }
  .field { position:relative; }
  input { width:100%; background:#0f0f0f; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:11px 64px 11px 12px; font:inherit; outline:none; }
  input:focus { border-color:rgba(126,224,168,.6); }
  .show { position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--muted); font:inherit; font-size:12.5px; padding:6px 8px; cursor:pointer; }
  .go { width:100%; margin-top:16px; background:var(--ok); color:#06210f; border:0; border-radius:10px; padding:11px; font:inherit; font-weight:600; cursor:pointer; }
  .go:disabled { opacity:.6; cursor:default; }
  .err { color:var(--bad); font-size:13px; min-height:20px; margin-top:10px; }
</style>
</head>
<body>
<form class="modal" id="f" autocomplete="off" role="dialog" aria-labelledby="t">
  <h1 id="t">Team stats</h1>
  <p>Enter the team password to continue.</p>
  <label for="pw">Password</label>
  <div class="field"><input id="pw" type="password" autocomplete="current-password" required autofocus><button type="button" class="show" id="show">Show</button></div>
  <button class="go" id="go" type="submit">Open stats</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
const $ = (id) => document.getElementById(id);
$("show").onclick = () => { const on = $("pw").type === "password"; $("pw").type = on ? "text" : "password"; $("show").textContent = on ? "Hide" : "Show"; };
$("f").onsubmit = async (e) => {
  e.preventDefault(); $("err").textContent = ""; $("go").disabled = true; $("go").textContent = "Checking…";
  try {
    const r = await fetch("/stat/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: $("pw").value }) });
    if (r.ok) { location.reload(); return; }
    $("err").textContent = (await r.json().catch(() => ({}))).error || "Could not sign in. Try again.";
    $("pw").select();
  } catch { $("err").textContent = "Could not reach the server. Try again."; }
  $("go").disabled = false; $("go").textContent = "Open stats";
};
</script>
</body>
</html>
