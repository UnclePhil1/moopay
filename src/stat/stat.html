<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>MooPay stats</title>
<link rel="icon" href="/app/assets/favicon.png">
<style>
  :root { --bg:#0a0a0a; --card:#161616; --line:rgba(244,239,230,.10); --text:#f4efe6; --muted:#aaa49a; --ok:#7ee0a8; --bad:#ff8a8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:28px 0 10px; font-weight:600; }
  .sub { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .tile.hero { border-color:rgba(126,224,168,.35); } .tile.hero b { font-size:34px; }
  .tile b { display:block; font-size:24px; line-height:1.2; } .tile span { color:var(--muted); font-size:12.5px; }
  .bar { display:flex; align-items:center; gap:10px; margin:6px 0; font-size:13.5px; } .bar i { display:block; height:10px; border-radius:5px; background:var(--ok); min-width:2px; } .bar .l { width:170px; color:var(--muted); flex:none; } .bar .n { color:var(--text); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; } td,th { text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); } th:first-child,td:first-child { text-align:left; } th { color:var(--muted); font-weight:500; }
    .err { color:var(--bad); font-size:13.5px; margin-top:8px; min-height:20px; }
</style>
</head>
<body>
<main>
  <div class="err" id="err"></div>
  <section id="view"></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const h = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v); for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k))); return e; };
const usd = (n) => "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const tile = (n, label) => h("div", { class: "tile" }, h("b", {}, n), h("span", {}, label));
const bars = (rows, fmt = (x) => x) => { const max = Math.max(1, ...rows.map((r) => r[1])); return rows.map(([l, n]) => h("div", { class: "bar" }, h("span", { class: "l" }, l), h("i", { style: "width:" + Math.round((n / max) * 100) + "%" }), h("span", { class: "n" }, fmt(n)))); };
function render(m) {
  const v = $("view"); v.replaceChildren(...[
    h("h1", {}, "MooPay stats"), h("div", { class: "sub" }, "Updated " + new Date(m.generatedAt).toLocaleString() + ". Counts include our own test accounts."),
    h("div", { class: "grid" }, h("div", { class: "tile hero" }, h("b", {}, m.agents.created), h("span", {}, "agents created = users (every user gets one agent wallet)")), h("div", { class: "tile hero" }, h("b", {}, usd(m.tvl.totalUsd)), h("span", {}, "total TVL: deposits + staking")), h("div", { class: "tile hero" }, h("b", {}, usd(m.money.movedUsd)), h("span", {}, "all money moved, " + m.money.transactions + " transactions"))),
    h("h2", {}, "TVL"), h("div", { class: "grid" }, tile(usd(m.tvl.depositsUsd), "deposited (recorded, or held now if higher)"), tile(usd(m.tvl.stakingUsd), "staking TVL"), tile(m.tvl.stakers, "people staking"), tile(usd(m.tvl.heldNowUsd), "in agent wallets now")),
    h("div", { class: "sub", style: "margin-top:8px" }, "Staking paid from an agent wallet is counted in both deposits and staking. Staking is worked out from our records at the dollar value when it was staked, not from live prices."),
    h("h2", {}, "People"), h("div", { class: "grid" }, tile(m.users.total, "users, all time"), tile(m.users.new24h, "new, 24h"), tile(m.users.new7d, "new, 7 days"), tile(m.users.new30d, "new, 30 days"), tile(m.users.active24h, "active, 24h"), tile(m.users.active7d, "active, 7 days"), tile(m.users.active30d, "active, 30 days"), tile(m.users.named, "picked a name"), tile(m.users.withPoints, "earned moo points"), tile(m.users.frozen, "frozen")),
    h("h2", {}, "Funnel"), bars(m.funnel.map((f) => [f.step, f.users])),
    h("h2", {}, "Money moved, by type"), h("div", { class: "grid" }, tile(usd(m.money.byKindUsd.deposits), "deposits"), tile(usd(m.money.byKindUsd.sends), "sent"), tile(usd(m.money.byKindUsd.claims), "private claims"), tile(usd(m.money.byKindUsd.staked), "staked"), tile(usd(m.money.byKindUsd.withdrawn), "withdrawn"), tile(usd(m.money.byKindUsd.sweptToPayout), "paid out above the float"), tile(usd(m.money.averageUsd), "average transaction"), tile(usd(m.money.largestUsd), "largest transaction"), tile(m.features.points, "moo points given")),
    h("h2", {}, "Last 14 days, all money moved"), h("table", {}, h("tr", {}, h("th", {}, "Day"), h("th", {}, "New users"), h("th", {}, "Payments"), h("th", {}, "Volume")), m.series.map((r) => h("tr", {}, h("td", {}, r.day), h("td", {}, r.signups), h("td", {}, r.payments), h("td", {}, usd(r.volumeUsd))))),
    h("h2", {}, "What people use"), h("div", { class: "grid" }, tile(m.features.stakes, "stakes"), tile(m.features.claims, "private claims"), tile(m.features.scheduled, "scheduled payments"), tile(m.agents.keys + " / " + m.agents.keysActive, "outside agent keys, made / active"), tile(m.features.private.total, "private sends"), tile(m.features.private.delivered + " / " + m.features.private.failed, "private, delivered / failed")),
    h("div", { style: "margin-top:14px" }, bars(Object.entries(m.money.byKind).sort((a, b) => b[1] - a[1]))),
    h("h2", {}, "Health"), h("div", { class: "grid" }, tile(m.health.failRate + "%", "failed or refunded"), tile(m.health.failed + " / " + m.health.settled, "failed / settled"), tile(m.approvals.approved, "approvals confirmed"), tile(m.approvals.declined, "approvals declined"), tile(m.approvals.expired, "approvals expired"), tile(m.approvals.pending, "approvals waiting"))].flat());
}
async function load() {
  const r = await fetch("/stat/data", { cache: "no-store" });
  if (!r.ok) throw new Error("Could not load the numbers.");
  render(await r.json()); $("err").textContent = "";
}
load().catch((e) => { $("err").textContent = e.message; });
setInterval(() => load().catch(() => {}), 60000);
</script>
</body>
</html>
