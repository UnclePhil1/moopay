<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Confirm with MooPay</title>
<link rel="icon" href="/a/favicon.png">
<style>
  :root { --bg:#0a0a0a; --card:#141414; --line:rgba(244,239,230,.1); --text:#f4efe6; --muted:#aaa49a; --ok:#9be3a8; --bad:#ff8a8a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif; display:grid; place-items:start center; padding:24px 16px; }
  main { width:min(460px,100%); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; }
  h1 { font-size:13px; font-weight:600; color:var(--muted); margin:0 0 10px; letter-spacing:.04em; text-transform:uppercase; }
  h2 { font-size:19px; margin:0 0 6px; }
  p { color:var(--muted); font-size:14px; margin:0 0 12px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  .row b { word-break:break-all; text-align:right; }
  button { width:100%; margin-top:16px; padding:13px; border-radius:12px; border:0; background:var(--text); color:#0a0a0a; font:inherit; font-weight:600; cursor:pointer; }
  #out { margin-top:14px; font-size:14px; color:var(--muted); } #out.ok { color:var(--ok); font-size:16px; } #out.bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>MooPay needs your OK</h1>
  <div id="card" hidden>
    <h2 id="sum"></h2>
    <p id="why"></p>
    <div id="rows"></div>
  </div>
  <div id="out" role="status">Loading…</div>
  <button id="go" type="button" hidden>Confirm with fingerprint, face or PIN</button>
  <button id="open" type="button" hidden style="background:none;color:var(--muted);border:1px solid var(--line)">Open in my browser</button>
</main>
<script src="/a/approve.js"></script>
</body>
</html>
