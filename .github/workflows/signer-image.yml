name: Signer image
on:
  push:
    branches: [main]
    paths: [Dockerfile.signer, src/signer/**, src/agent/crypto.ts, package-lock.json, .github/workflows/signer-image.yml]
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.signer
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/moopay-signer:${{ github.sha }}
      # The digest, not the tag, goes in the Phala compose file.
      - run: echo "ghcr.io/${{ github.repository_owner }}/moopay-signer@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
